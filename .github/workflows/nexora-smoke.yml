name: Nexora syntax and browser-store checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source without running browsers
        run: python -m compileall -q app.py cloud_store.py storage.py server.py browser_manager.py runner/worker.py
      - name: Check metadata storage and JavaScript
        run: node --test tests/test_browser_store.cjs
