name: Nexora syntax and browser-store checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source without running browsers
        run: python -m compileall -q app.py cloud_store.py storage.py server.py browser_manager.py fingerprint_manager.py device_profile_manager.py session_manager.py scripts/update_device_catalog.py runner/worker.py runner/start_windows.py
      - name: Check metadata storage and JavaScript
        run: node --test tests/test_browser_store.cjs tests/test_remote_cloudflare.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner and Chromium
        run: |
          pip install -r runner/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate production server entry point
        run: cd runner && gunicorn --check-config worker:app
      - name: Compare browser environment before/after localization (no internet)
        run: python -m unittest discover -s tests -p test_browser_environment.py -v
      - name: Localhost CRUD and multi-device browser integration
        run: python -m unittest discover -s tests -p test_http.py -v && python -m unittest discover -s tests -p test_app.py -v
      - name: Real browser profile isolation and persistence
        run: python -m unittest discover -s tests -p test_runner_browser.py -v
      - name: Headed Chromium windows in a virtual desktop (Xvfb)
        run: NEXORA_DESKTOP_MODE=1 xvfb-run -a python -m unittest discover -s tests -p test_runner_browser.py -v
  windows-browser-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows Chromium and dependencies
        run: |
          python -m pip install -r runner/requirements-windows.txt
          python -m playwright install chromium
      - name: Verify actual Windows locale and Chromium HTTP headers
        run: python -m unittest discover -s tests -p test_browser_environment.py -v
      - name: Verify expanded Playwright device catalog on Windows
        run: python -m unittest discover -s tests -p test_runner_browser.py -k test_catalog_comes_from_real_playwright_android_descriptors -v
